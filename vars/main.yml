---
php_key_url: https://packages.sury.org/php/apt.gpg
php_key_path: /usr/share/keyrings/
php_key_name: deb.sury.org-php.gpg

php_repositories:
  - deb [signed-by={{ php_key_path }}{{ php_key_name }}] https://packages.sury.org/php/ {{ ansible_facts['distribution_release'] }} main 
  - deb-src  [signed-by={{ php_key_path }}{{ php_key_name }}] https://packages.sury.org/php/ {{ ansible_facts['distribution_release'] }} main 

php_path: "/etc/php/{{ php_version }}"
php_cli_path: "{{ php_path }}/cli/"
php_fpm_path: "{{ php_path }}/fpm/"
php_fpm_poold_path: "{{ php_fpm_path }}/pool.d/"
php_file_mode: 0644
